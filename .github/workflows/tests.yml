name: tests

on:
  push:
    branches:
      - main
      - '*.x'
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.2'
            laravel: '10.*'
            testbench: '8.*'
          - php: '8.4'
            laravel: '12.*'
            testbench: '10.*'
          - php: '8.5'
            laravel: '13.*'
            testbench: '11.*'

    name: Quality - P${{ matrix.php }} - L${{ matrix.laravel }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, fileinfo, sqlite, pdo_sqlite, bcmath, intl
          ini-values: error_reporting=E_ALL
          tools: composer:v2
          coverage: none

      - name: Validate composer
        run: composer validate --strict

      - name: Install dependencies
        run: |
          # Laravel 10/11 are EOL and have known advisories. Compatibility is still
          # tested; the latest lane runs `composer audit` below.
          composer require --dev "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update
          composer update --prefer-stable --prefer-dist --no-interaction --no-progress --no-scripts --no-security-blocking

      - name: Prepare Testbench
        shell: bash
        run: |
          php -r 'require "vendor/autoload.php"; $base = Orchestra\Testbench\default_skeleton_path(); if ($base === false) { fwrite(STDERR, "Unable to resolve Testbench skeleton path.\n"); exit(1); } $cache = $base.DIRECTORY_SEPARATOR."bootstrap".DIRECTORY_SEPARATOR."cache"; if (! is_dir($cache)) { mkdir($cache, 0777, true); } @chmod($cache, 0777);'
          composer run prepare

      - name: Show resolved versions
        run: composer show --direct

      - name: Composer audit
        if: matrix.laravel == '13.*'
        run: composer audit

      - name: PHPStan
        run: composer analyse

      - name: Linter
        run: composer lint:check

      - name: Type Coverage
        run: composer test:types

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        laravel: ['10.*', '11.*', '12.*', '13.*']
        stability: [prefer-lowest, prefer-stable]
        include:
          - laravel: '10.*'
            testbench: '8.*'
          - laravel: '11.*'
            testbench: '9.*'
          - laravel: '12.*'
            testbench: '10.*'
          - laravel: '13.*'
            testbench: '11.*'
        exclude:
          - php: '8.4'
            laravel: '10.*'
          - php: '8.5'
            laravel: '10.*'
          - php: '8.5'
            laravel: '11.*'
          - php: '8.2'
            laravel: '13.*'

    name: P${{ matrix.php }} - L${{ matrix.laravel }} - ${{ matrix.stability }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, fileinfo, sqlite, pdo_sqlite, bcmath, intl
          ini-values: error_reporting=E_ALL
          tools: composer:v2
          coverage: none

      - name: Install dependencies
        run: |
          composer require --dev "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update
          composer update --${{ matrix.stability }} --prefer-dist --no-interaction --no-progress --no-scripts --no-security-blocking

      - name: Prepare Testbench
        shell: bash
        run: |
          php -r 'require "vendor/autoload.php"; $base = Orchestra\Testbench\default_skeleton_path(); if ($base === false) { fwrite(STDERR, "Unable to resolve Testbench skeleton path.\n"); exit(1); } $cache = $base.DIRECTORY_SEPARATOR."bootstrap".DIRECTORY_SEPARATOR."cache"; if (! is_dir($cache)) { mkdir($cache, 0777, true); } @chmod($cache, 0777);'

      - name: Test Suite
        run: composer test:unit

  windows:
    runs-on: windows-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.2'
            laravel: '10.*'
            testbench: '8.*'
          - php: '8.3'
            laravel: '11.*'
            testbench: '9.*'
          - php: '8.4'
            laravel: '12.*'
            testbench: '10.*'
          - php: '8.5'
            laravel: '13.*'
            testbench: '11.*'

    name: Windows - P${{ matrix.php }} - L${{ matrix.laravel }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, fileinfo, sqlite, pdo_sqlite, bcmath, intl
          ini-values: error_reporting=E_ALL
          tools: composer:v2
          coverage: none

      - name: Install dependencies
        run: |
          composer require --dev "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update
          composer update --prefer-stable --prefer-dist --no-interaction --no-progress --no-scripts --no-security-blocking

      - name: Prepare Testbench
        shell: bash
        run: |
          php -r 'require "vendor/autoload.php"; $base = Orchestra\Testbench\default_skeleton_path(); if ($base === false) { fwrite(STDERR, "Unable to resolve Testbench skeleton path.\n"); exit(1); } $cache = $base.DIRECTORY_SEPARATOR."bootstrap".DIRECTORY_SEPARATOR."cache"; if (! is_dir($cache)) { mkdir($cache, 0777, true); } @chmod($cache, 0777);'

      - name: Test Suite
        run: vendor/bin/pest
